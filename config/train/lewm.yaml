defaults:
  - _self_
  - launcher: local
  - data: pusht
  - model: lewm

output_model_name: lewm
subdir: ${hydra:job.id}

# push each epoch's weights to the HuggingFace Hub (needs `hf auth login` or HF_TOKEN)
hf_hub:
  repo_id: null  # e.g. <username>/lewm-pusht; null disables uploading
  private: True

num_workers: 6
train_split: 0.9
windows_per_episode: null  # int: build batches from chunks of this many same-episode windows
seed: 3072
img_size: 224
embed_dim: 192
history_size: 3

trainer:
  max_epochs: 100
  devices: auto
  accelerator: gpu
  precision: bf16
  gradient_clip_val: 1.0

loader:
  batch_size: 128
  num_workers: ${num_workers}
  persistent_workers: True
  prefetch_factor: 3
  pin_memory: True

optimizer:
  type: AdamW
  lr: 5e-5
  weight_decay: 1e-3

num_preds: 1

loss:
  sigreg:
    weight: 0.09
    kwargs:
      knots: 17
      num_proj: 1024
  # VICReg variance/covariance on within-episode changes z_{t+1} - z_t
  # (only transitions whose pixels changed); 0 disables
  delta_vicreg:
    var_weight: 0.0
    cov_weight: 0.0
    gamma: 1.0
  # SIGReg (same test as above) on the same within-episode changes; 0 disables
  delta_sigreg:
    weight: 0.0
