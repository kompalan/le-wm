dataset:
  num_steps: ${eval:'${num_preds} + ${history_size}'}
  frameskip: 1  # one MiniWoB step is already one discrete click
  name: miniwob_click_cursor.h5
  keys_to_load:
    - pixels
    - action
    - page_changed  # pointer-free change mask for the within-episode losses
  keys_to_cache:
    - action
    - page_changed
